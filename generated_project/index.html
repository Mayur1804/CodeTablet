<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <!-- Numeric buttons -->
            <button id="btn-7" data-action="7">7</button>
            <button id="btn-8" data-action="8">8</button>
            <button id="btn-9" data-action="9">9</button>
            <button id="btn-divide" data-action="÷">÷</button>
            <button id="btn-4" data-action="4">4</button>
            <button id="btn-5" data-action="5">5</button>
            <button id="btn-6" data-action="6">6</button>
            <button id="btn-multiply" data-action="×">×</button>
            <button id="btn-1" data-action="1">1</button>
            <button id="btn-2" data-action="2">2</button>
            <button id="btn-3" data-action="3">3</button>
            <button id="btn-subtract" data-action="-">-</button>
            <button id="btn-0" data-action="0">0</button>
            <button id="btn-backspace" data-action="backspace">⌫</button>
            <button id="btn-equals" data-action="=">=</button>
            <button id="btn-add" data-action="+">+</button>
            <button id="btn-clear" data-action="clear">C</button>
        </div>
    </div>
    <footer>
        <a href="README.md" target="_blank">Read the README</a>
    </footer>
</body>
</html>
