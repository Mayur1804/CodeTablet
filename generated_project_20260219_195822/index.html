<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Break Timer</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <div id="main-container">
        <h1 id='app-title'>Mindful Break Timer</h1>
        <div id='timer-display'>25:00</div>
        <div id="control-section">
            <button id='start-btn'>Start</button>
            <button id='pause-btn'>Pause</button>
            <button id='reset-btn'>Reset</button>
        </div>
        <div id="duration-inputs">
            <input id='work-duration' type='number' placeholder='25'>
            <input id='break-duration' type='number' placeholder='5'>
        </div>
        <div id='mindful-suggestions'></div>
    </div>
    <script src='script.js'></script>
</body>
</html>
